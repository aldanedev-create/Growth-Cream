<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Growth Cream</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/themes.css">
    <style>
        .offline-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .offline-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--pink-light), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .offline-text {
            color: var(--text-muted);
            margin-bottom: 2rem;
            max-width: 400px;
        }
        
        .offline-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1 class="offline-title">You're Offline</h1>
        <p class="offline-text">
            Don't worry! Growth Cream works offline. Your data is safe and stored locally on your device.
        </p>
        <div class="offline-actions">
            <button class="btn btn-primary" onclick="window.location.href='/'">
                <span>🏠</span>
                Go to Dashboard
            </button>
            <button class="btn" onclick="window.location.reload()">
                <span>🔄</span>
                Retry Connection
            </button>
        </div>
        <p style="margin-top: 2rem; color: var(--text-dim); font-size: 0.875rem;">
            <span style="color: var(--pink);">✦</span>
            Your growth continues even without internet
            <span style="color: var(--pink);">✦</span>
        </p>
    </div>
</body>
</html>
